name: 'Delete old artifacts'
on:
  workflow_call:
    secrets:
      ACCESS_TOKEN:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
        
permissions:
  actions: write
  
jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: kolpav/purge-artifacts-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          expire-in: 2days # Setting this to 0 will delete all artifacts

