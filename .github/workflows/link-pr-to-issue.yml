name: PR → Issue Linker (smart)

on:
  workflow_call:
    inputs:
      allowed_owners:
        description: >-
          Space-separated list of GitHub owners/orgs whose issues may be linked.
          References to any other owner are ignored. Defaults to the owner of the
          calling repository.
        type: string
        required: false
        default: ''
      max_links:
        description: >-
          Maximum number of issue references allowed per PR. If a PR references
          more than this, nothing is linked (it is almost always pasted
          changelog text, e.g. Dependabot release notes).
        type: number
        required: false
        default: 5
    secrets:
      ACTION_PAT:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  LOG_PREFIX: "[PR-Linker]"

jobs:
  link:
    # Never run for bot-authored PRs (dependabot[bot], renovate[bot], ...).
    # Their descriptions embed upstream release notes full of owner/repo#N
    # references, which previously caused comment spam on third-party repos.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Validate inputs
        id: validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "${{ env.LOG_PREFIX }} Starting validation..."

          BODY="${PR_TITLE} ${PR_BODY}"

          if [ -z "$BODY" ] || [ "$BODY" == "null" ]; then
            echo "${{ env.LOG_PREFIX }} ℹ️ No PR content found"
            echo "has_issues=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_issues=true" >> $GITHUB_OUTPUT

      - name: Extract issue references
        id: extract
        if: steps.validate.outputs.has_issues == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          SOURCE_REPO: ${{ github.repository }}
          ALLOWED_OWNERS: ${{ inputs.allowed_owners || github.repository_owner }}
          MAX_LINKS: ${{ inputs.max_links }}
        run: |
          echo "${{ env.LOG_PREFIX }} Extracting issue references..."
          echo "${{ env.LOG_PREFIX }} Allowed owners: ${ALLOWED_OWNERS}"

          BODY="${PR_TITLE} ${PR_BODY}"

          # Normalise every reference to owner/repo#N (bare #N -> current repo),
          # then keep only references whose owner is in the allow-list.
          ISSUES=$(echo "$BODY" | \
            grep -Eo '([a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+)?#[0-9]+' | \
            sed -E "s|^#|${SOURCE_REPO}#|" | \
            while IFS= read -r REF; do
              OWNER="${REF%%/*}"
              for ALLOWED in $ALLOWED_OWNERS; do
                if [ "${OWNER,,}" == "${ALLOWED,,}" ]; then
                  echo "$REF"
                  break
                fi
              done
            done | \
            sort -fu)

          if [ -z "$ISSUES" ]; then
            echo "${{ env.LOG_PREFIX }} No in-scope issues found"
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          ISSUE_COUNT=$(echo "$ISSUES" | wc -l)

          echo "${{ env.LOG_PREFIX }} Found $ISSUE_COUNT in-scope reference(s)"

          if [ "$ISSUE_COUNT" -gt "$MAX_LINKS" ]; then
            echo "::warning::${{ env.LOG_PREFIX }} $ISSUE_COUNT references exceed max_links=$MAX_LINKS; skipping linking to avoid comment spam."
            echo "capped=true" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "count=$ISSUE_COUNT" >> $GITHUB_OUTPUT

          echo "issues<<EOF" >> $GITHUB_OUTPUT
          echo "$ISSUES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Cleanup stale issue links
        # Don't treat links as stale when extraction was skipped due to max_links.
        if: github.event.action == 'edited' && steps.extract.outputs.capped != 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SOURCE_REPO: ${{ github.repository }}
          ALLOWED_OWNERS: ${{ inputs.allowed_owners || github.repository_owner }}
          CURRENT_ISSUES: ${{ steps.extract.outputs.issues }}
        run: |
          set +e
          set +o pipefail

          echo "${{ env.LOG_PREFIX }} Cleaning stale issue links..."

          MARKER="pr-linker:${PR_URL}"

          # Restrict the search to allowed owners only.
          QUALIFIERS=""
          for ALLOWED in $ALLOWED_OWNERS; do
            QUALIFIERS="${QUALIFIERS}+org:${ALLOWED}"
          done

          SEARCH_RESPONSE=$(curl -s -G \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/issues?q=%22${MARKER}%22+in:comments${QUALIFIERS}")

          COMMENT_URLS=$(echo "$SEARCH_RESPONSE" | \
            jq -r '.items[].comments_url' 2>/dev/null || true)

          while IFS= read -r COMMENTS_URL; do
            [ -z "$COMMENTS_URL" ] && continue

            ISSUE_API=$(echo "$COMMENTS_URL" | sed 's|/comments$||')

            ISSUE_DATA=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$ISSUE_API")

            ISSUE_NUMBER=$(echo "$ISSUE_DATA" | jq -r '.number')

            ISSUE_REPO=$(echo "$ISSUE_DATA" | \
              jq -r '.repository_url' | \
              sed 's|https://api.github.com/repos/||')

            ISSUE_REF="${ISSUE_REPO}#${ISSUE_NUMBER}"

            # CURRENT_ISSUES is already normalised to owner/repo#N.
            if ! echo "$CURRENT_ISSUES" | grep -qixF "$ISSUE_REF"; then

              echo "${{ env.LOG_PREFIX }} Removing stale link from $ISSUE_REF"

              COMMENT_ID=""
              CLEANUP_PAGE=1

              while :; do
                COMMENTS_DATA=$(curl -s \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "${COMMENTS_URL}?per_page=100&page=$CLEANUP_PAGE")

                COMMENT_ID=$(echo "$COMMENTS_DATA" | jq -r \
                  --arg marker "$MARKER" \
                  '.[] | select(.body | contains($marker)) | .id' \
                  2>/dev/null | head -n1 || true)

                [ -n "$COMMENT_ID" ] && break

                CLEANUP_PAGE_SIZE=$(echo "$COMMENTS_DATA" | jq 'length' 2>/dev/null || echo 0)

                [ "$CLEANUP_PAGE_SIZE" -lt 100 ] && break

                CLEANUP_PAGE=$((CLEANUP_PAGE + 1))
              done

              if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then

                curl -s -X DELETE \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$ISSUE_REPO/issues/comments/$COMMENT_ID"

                echo "${{ env.LOG_PREFIX }} Deleted stale comment from $ISSUE_REF"
              fi
            fi

          done <<< "$COMMENT_URLS"

      - name: Process issue links
        if: steps.extract.outputs.count > 0
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SOURCE_REPO: ${{ github.repository }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          ISSUES: ${{ steps.extract.outputs.issues }}
        run: |
          set +e
          set +o pipefail

          MARKER="<!-- pr-linker:${PR_URL} -->"

          PROCESSED=0
          SKIPPED=0
          FAILED=0

          echo "${{ env.LOG_PREFIX }} Processing issues..."

          if [[ "$PR_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
            STATUS="MERGED ✅"
          elif [[ "$PR_ACTION" == "closed" && "$PR_MERGED" == "false" ]]; then
            STATUS="CLOSED ❌"
          else
            STATUS="OPEN 🔄"
          fi

          while IFS= read -r ISSUE; do
            [ -z "$ISSUE" ] && continue

            # Extract step guarantees owner/repo#N form.
            REPO="${ISSUE%%#*}"
            NUMBER="${ISSUE##*#}"

            if ! [[ "$NUMBER" =~ ^[0-9]+$ ]]; then
              echo "${{ env.LOG_PREFIX }} Invalid issue number: $NUMBER"
              ((FAILED++))
              continue
            fi

            echo "${{ env.LOG_PREFIX }} → Processing $REPO#$NUMBER"

            # Only link real issues: skip PRs and references that don't resolve.
            ISSUE_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$NUMBER")

            ISSUE_HTTP=$(echo "$ISSUE_RESPONSE" | tail -n1)
            ISSUE_JSON=$(echo "$ISSUE_RESPONSE" | head -n-1)

            if [ "$ISSUE_HTTP" != "200" ]; then
              echo "${{ env.LOG_PREFIX }} Skipping $REPO#$NUMBER (HTTP $ISSUE_HTTP)"
              ((SKIPPED++))
              continue
            fi

            if [ "$(echo "$ISSUE_JSON" | jq -r 'has("pull_request")')" == "true" ]; then
              echo "${{ env.LOG_PREFIX }} Skipping $REPO#$NUMBER (is a pull request)"
              ((SKIPPED++))
              continue
            fi

            COMMENT_ID=""
            PAGE=1

            while :; do
              COMMENTS_RESPONSE=$(curl -s -w "\n%{http_code}" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/issues/$NUMBER/comments?per_page=100&page=$PAGE")

              HTTP_CODE=$(echo "$COMMENTS_RESPONSE" | tail -n1)
              COMMENTS_BODY=$(echo "$COMMENTS_RESPONSE" | head -n-1)

              if [ "$HTTP_CODE" != "200" ]; then
                echo "${{ env.LOG_PREFIX }} Failed to fetch comments (HTTP $HTTP_CODE)"
                ((FAILED++))
                continue 2
              fi

              COMMENT_ID=$(echo "$COMMENTS_BODY" | jq -r \
                --arg marker "$MARKER" \
                '.[] | select(.body | contains($marker)) | .id' \
                2>/dev/null | head -n1 || true)

              [ -n "$COMMENT_ID" ] && break

              PAGE_SIZE=$(echo "$COMMENTS_BODY" | jq 'length')

              [ "$PAGE_SIZE" -lt 100 ] && break

              PAGE=$((PAGE + 1))
            done

            BODY_TEXT="🔗 Linked PR

            - PR: ${PR_URL}
            - Source: ${SOURCE_REPO}
            - Status: ${STATUS}
            - Updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

            ${MARKER}"

            if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then

              echo "${{ env.LOG_PREFIX }} Updating comment $COMMENT_ID"

              UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/$REPO/issues/comments/$COMMENT_ID" \
                -d "$(jq -n --arg body "$BODY_TEXT" '{body: $body}')")

              UPDATE_CODE=$(echo "$UPDATE_RESPONSE" | tail -n1)

              if [[ "$UPDATE_CODE" =~ ^(200|201)$ ]]; then
                ((PROCESSED++))
              else
                echo "${{ env.LOG_PREFIX }} Update failed (HTTP $UPDATE_CODE)"
                ((FAILED++))
              fi

            else

              echo "${{ env.LOG_PREFIX }} Creating new comment"

              CREATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/$REPO/issues/$NUMBER/comments" \
                -d "$(jq -n --arg body "$BODY_TEXT" '{body: $body}')")

              CREATE_CODE=$(echo "$CREATE_RESPONSE" | tail -n1)

              if [[ "$CREATE_CODE" =~ ^(200|201)$ ]]; then
                ((PROCESSED++))
              else
                echo "${{ env.LOG_PREFIX }} Create failed (HTTP $CREATE_CODE)"
                ((FAILED++))
              fi
            fi

          done <<< "$ISSUES"

          echo "${{ env.LOG_PREFIX }} Done. Processed: $PROCESSED | Skipped: $SKIPPED | Failed: $FAILED"

          exit 0

      - name: Success summary
        if: success()
        run: |
          echo "${{ env.LOG_PREFIX }} ✅ Workflow completed successfully"
