name: Go Sonar Analysis

on:
  workflow_call:
    inputs:
      SERVICE_LOCATION:
        required: true
        type: string
      GO_VERSION:
        required: false
        type: string
        default: '1.26'
      SONAR_URL:
        required: false
        type: string
        default: 'https://sonarcloud.io'
      SONAR_SOURCES:
        required: false
        type: string
        default: '.'
      SONAR_TESTS:
        required: false
        type: string
        default: '.'
      SONAR_TEST_INCLUSIONS:
        required: false
        type: string
        default: '**/*_test.go'
      SONAR_EXCLUSIONS:
        required: false
        type: string
        default: '**/vendor/**,**/*_test.go,internal/clientmgmt/db/**,internal/consentmgmt/db/**'
      SONAR_ARGS:
        required: false
        type: string
        default: ""
    secrets:
      SONAR_TOKEN:
        required: true
      ORG_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        required: true

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  ORG_KEY: ${{ secrets.ORG_KEY }}

jobs:
  go-sonar-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.GO_VERSION }}

    - name: Cache Go Modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Run tests with coverage
      run: |
        cd ${{ inputs.SERVICE_LOCATION }}
        go test -coverprofile=coverage.out -covermode=atomic ./...

    - name: setup sonar properties
      run: |
        if [[ -z $SONAR_TOKEN ]]; then
          echo "\$SONAR_TOKEN environmental variable not set; EXITING;";
          exit 1;
        fi
        if [[ -z $ORG_KEY ]]; then
          echo "\$ORG_KEY environmental variable not set; EXITING;";
          exit 1;
        fi
        if [[ -z $SONAR_URL ]]; then
          echo "\$SONAR_URL environmental variable not set; EXITING;";
          exit 1;
        fi

        SERVICE_KEY=$(echo "${{ inputs.SERVICE_LOCATION }}" | sed 's|^\./||; s|^\.$||; s|[^a-zA-Z0-9]|-|g; s|-\\+|-|g; s|^-||; s|-$||')
        FINAL_NAME="${{ github.event.repository.name }}${SERVICE_KEY:+-$SERVICE_KEY}"
        FULL_PROJECT_KEY="${ORG_KEY}_${FINAL_NAME}"

        cd "./${{inputs.SERVICE_LOCATION}}"

        echo "
          sonar.host.url=${{ inputs.SONAR_URL }}
          sonar.projectKey=${FULL_PROJECT_KEY}
          sonar.projectName=${FINAL_NAME}
          sonar.sourceEncoding=UTF-8
          sonar.sources=${{ inputs.SONAR_SOURCES }}
          sonar.tests=${{ inputs.SONAR_TESTS }}
          sonar.test.inclusions=${{ inputs.SONAR_TEST_INCLUSIONS }}
          sonar.exclusions=${{ inputs.SONAR_EXCLUSIONS }}
          sonar.go.coverage.reportPaths=coverage.out" >> sonar-project.properties
      env:
        SONAR_URL: ${{ inputs.SONAR_URL }}

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8
      with:
        projectBaseDir: ${{ inputs.SERVICE_LOCATION }}
        args: >
          -Dsonar.organization=${{ secrets.ORG_KEY }}
          ${{ inputs.SONAR_ARGS }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ inputs.SONAR_URL }}

